<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KR Pure Applications</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 720x1600 Aspect Ratio Container for Laptop/Desktop */
.app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 450px; /* ল্যাপটপে 720x1600 রেশিও বজায় রাখবে */
    max-height: 1000px;
    aspect-ratio: 720 / 1600;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
}

/* 720x1600 exact image scaling */
.splash {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    /* 720x1600 পিক্সেলে ছবিকে স্ট্রেচ/ফিট করার জন্য */
    background: url("app_open.png") center center / 100% 100% no-repeat;
}

/* Bottom content */
.bottom-content {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

/* Circular Loader Container */
.circle-loader {
    position: relative;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: conic-gradient(#087A38 0deg, rgba(255, 255, 255, 0.1) 0deg);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 10px rgba(0,0,0,0.8);
}

/* Inner overlay for hollow circle */
.circle-loader::before {
    content: "";
    position: absolute;
    width: 53px;
    height: 53px;
    border-radius: 50%;
    background: #000;
}

/* Percentage text inside circle */
.loading-percent {
    position: relative;
    z-index: 2;
    color: #FFD700;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 0 0 5px #000;
}

/* Green loading track */
.loading-track {
    position: relative;
    width: 82%;
    max-width: 380px;
    height: 12px;
    background: #087A38;
    border-radius: 50px;
    overflow: hidden;
    box-shadow: 0 0 8px rgba(0,0,0,0.9), inset 0 0 5px rgba(0,0,0,0.7);
}

/* Golden loading bar */
.loading-fill {
    position: relative;
    width: 0%;
    height: 100%;
    background: #FFD700;
    border-radius: 50px;
    overflow: hidden;
    animation: loading 5s linear forwards;
}

/* Golden shine effect */
.loading-fill::after {
    content: "";
    position: absolute;
    top: 0;
    left: -70px;
    width: 70px;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.9),
        transparent
    );
    animation: shine 5s linear forwards;
}

/* Linear Bar Animation (5 seconds) */
@keyframes loading {
    from { width: 0%; }
    to { width: 100%; }
}

/* Shine movement */
@keyframes shine {
    from { left: -70px; }
    to { left: 100%; }
}

/* Company name */
.company-name {
    color: #fff;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-align: center;
    text-shadow: 0 1px 4px #000, 0 0 8px #000;
}
</style>
</head>

<body>

<div class="app-container">
    <div class="splash">
        <div class="bottom-content">

            <!-- Circular Loader with Percentage inside -->
            <div class="circle-loader" id="circleLoader">
                <div class="loading-percent" id="loadingPercent">0%</div>
            </div>

            <!-- Green track + Golden bar -->
            <div class="loading-track">
                <div class="loading-fill"></div>
            </div>

            <!-- Company name -->
            <div class="company-name">
                KR pure applications limited bd
            </div>

        </div>
    </div>
</div>

<script>
const loadingTime = 5000;
const percentText = document.getElementById("loadingPercent");
const circleLoader = document.getElementById("circleLoader");

const startTime = Date.now();

const percentTimer = setInterval(function () {
    const elapsed = Date.now() - startTime;
    let progress = elapsed / loadingTime;

    if (progress >= 1) {
        progress = 1;
        clearInterval(percentTimer);
    }

    let percent = Math.floor(progress * 100);
    percentText.textContent = percent + "%";

    let degrees = progress * 360;
    circleLoader.style.background = `conic-gradient(#087A38 ${degrees}deg, rgba(255, 255, 255, 0.1) ${degrees}deg)`;

}, 10);

/* ৫ সেকেন্ড পর রিডাইরেক্ট */
setTimeout(function () {
    const newWindow = window.open("abnaye_darul_uloom.html", "_blank");
    if (!newWindow) {
        window.location.href = "abnaye_darul_uloom.html";
    }
}, loadingTime);
</script>

</body>
</html>
