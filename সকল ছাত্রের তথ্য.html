.sync-header-status {

}
.sync-preview-card {

.sync-preview-img {

.sync-preview-info {

.sync-preview-line {

    display: block;

}
.sync-preview-name {

function loadFromCache() {
    try {
        const cached = sessionStorage.getItem('studentProfilesCache');
        if (cached) {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
    } catch (e) { console.warn("Cache load failed:", e); }
    return null;
}

function saveToCache(data) {
    try { sessionStorage.setItem('studentProfilesCache', JSON.stringify(data)); } catch (e) { console.warn("Cache save failed:", e); }
}

async function playProgressiveSync(students) {
    const syncStatusContainer = document.getElementById('syncStatusContainer');
    const profilesContainer = document.getElementById('profilesContainer');
    profilesContainer.innerHTML = "";

    for (let i = 0; i < students.length; i++) {
        let st = students[i];
        st.originalIndex = i + 1;
        let serialNo = convertToBanglaNumber(i + 1);
        let studentIdName = st.id || "নেই";
        let studentMediaHtml = st.image ? `<img src="${st.image}" class="sync-preview-img">` : `<div class="sync-preview-emoji">👳‍♂️</div>`;

        syncStatusContainer.innerHTML = `
            <div class="sync-live-box">
                <div class="sync-header-status">⚡ ফায়ারবেস সিংক হচ্ছে (${i + 1}/${students.length})...</div>
                <div class="sync-preview-card">
                    ${studentMediaHtml}
                    <div class="sync-preview-info">
                        <span class="sync-preview-line">ক্রমিক নং: ${serialNo}</span>
                        <span class="sync-preview-line">আইডি: ${studentIdName}</span>
                        <span class="sync-preview-name">${st.name}</span>
                    </div>
                </div>
            </div>
        `;

        profilesContainer.innerHTML += generateProfileCardHtml(st, i + 1);
        await new Promise(resolve => setTimeout(resolve, 300));
    }

    syncStatusContainer.innerHTML = `
        <div class="sync-live-box" style="background:#e8f5e9; border-color:#198754; align-items:center;">
            <div class="sync-header-status" style="color:#0a3622; font-size:13px;">✅ ফায়ারবেস সিংক সফল হয়েছে! (${students.length} জন)</div>
        </div>
    `;

    setTimeout(() => {
        let box = syncStatusContainer.querySelector('.sync-live-box');
        if (box) {
            box.style.opacity = '0';
            setTimeout(() => { syncStatusContainer.innerHTML = ""; }, 300);
        } else { syncStatusContainer.innerHTML = ""; }
    }, 1000);
}

async function initAndSyncModel() {
    const collectionRef = db.collection("students");
    const syncStatusContainer = document.getElementById('syncStatusContainer');
    const profilesContainer = document.getElementById('profilesContainer');

    window.activeStudents = [];
    profilesContainer.innerHTML = "";

    try {
        // ১. অতিরিক্ত ছাত্র ফায়ারবেস থেকে মুছে ফেলা (Auto-Cleanup)
        let existingSnapshot = await collectionRef.get();
        let localIds = localSourceData.map(s => s.id);

        let batch = db.batch();
        let hasDeletions = false;

        existingSnapshot.docs.forEach(doc => {
            if (!localIds.includes(doc.id)) {
                batch.delete(doc.ref);
                hasDeletions = true;
            }
        });

        if (hasDeletions) {
            await batch.commit();
        }

        // ২. লোকাল লিস্টের ছাত্রগুলো ফায়ারবেসে সিংক ও অনুমতি ফিল্ডগুলো নিশ্চিত করা (ফিল্ড না থাকলে যোগ করা, তবে রিসেট না করা)
        for (let student of localSourceData) {
            let docRef = collectionRef.doc(student.id);
            let docSnap = await docRef.get();

            if (!docSnap.exists) {
                await docRef.set({
                    ...student,
                    "অ্যাপ ব্যবহারের অনুমতি": true,
                    "প্রোফাইল প্রদর্শনের অনুমতি": true,
                    "ছাত্রের সক্রিয়তা অনুমতি": true,
                    "রোজনামচা লেখার অনুমতি": true,
                    "কবিতা লেখার অনুমতি": true,
                    "গল্প লেখার অনুমতি": true
                });
            } else {
                let existingData = docSnap.data();
                let updates = {};
                if (existingData["অ্যাপ ব্যবহারের অনুমতি"] === undefined) updates["অ্যাপ ব্যবহারের অনুমতি"] = true;
                if (existingData["প্রোফাইল প্রদর্শনের অনুমতি"] === undefined) updates["প্রোফাইল প্রদর্শনের অনুমতি"] = true;
                if (existingData["ছাত্রের সক্রিয়তা অনুমতি"] === undefined) updates["ছাত্রের সক্রিয়তা অনুমতি"] = true;
                if (existingData["রোজনামচা লেখার অনুমতি"] === undefined) updates["রোজনামচা লেখার অনুমতি"] = true;
                if (existingData["কবিতা লেখার অনুমতি"] === undefined) updates["কবিতা লেখার অনুমতি"] = true;
                if (existingData["গল্প লেখার অনুমতি"] === undefined) updates["গল্প লেখার অনুমতি"] = true;

                if (Object.keys(updates).length > 0) {
                    await docRef.update(updates);
                }
            }
        }

        // ৩. ফাইনাল ডেটা রিড করে স্ক্রিনে লোড করা
        let snapshot = await collectionRef.get();
        let allowedList = [];

        if (!snapshot.empty) {
            snapshot.docs.forEach(doc => {
                let remoteData = doc.data();
                if (!remoteData.id) remoteData.id = doc.id;

                // শর্ত: ছাত্রের সক্রিয়তা এবং প্রোফাইল প্রদর্শনের অনুমতি দুটিতেই true থাকা আবশ্যক (অ্যাপ ব্যবহারের অনুমতি যাই হোক না কেন)
                let profilePermission = remoteData["প্রোফাইল প্রদর্শনের অনুমতি"] !== false;
                let activePermission = remoteData["ছাত্রের সক্রিয়তা অনুমতি"] !== false;

                if (profilePermission && activePermission) {
                    if (!remoteData.socials) remoteData.socials = {};
                    if (remoteData.mobile) {
                        let rawMobile = remoteData.mobile.toString();
                        let number = rawMobile.replace(/[^\d]/g, "");
                        if (number.startsWith("0")) number = "88" + number;
                        if (rawMobile.toLowerCase().includes("wa")) remoteData.socials.wa = `https://wa.me/${number}`;
                        if (rawMobile.toLowerCase().includes("imo")) remoteData.socials.imo = `imo://chat?phone=${number}`;
                    }
                    allowedList.push(remoteData);
                }
            });
        }

        saveToCache(allowedList);
        window.activeStudents = allowedList;

        await playProgressiveSync(allowedList);
        startRealtimeListener(collectionRef);

    } catch (err) {
        console.error("Firebase sync error:", err);
        syncStatusContainer.innerHTML = `
            <div class="sync-live-box">
                <div class="sync-header-status">❌ সংযোগ ব্যর্থ হয়েছে</div>
            </div>
        `;
    }
}

function startRealtimeListener(collectionRef) {
    if (unsubscribeSnapshot) unsubscribeSnapshot();

    let isFirstSnapshot = true;

    unsubscribeSnapshot = collectionRef.onSnapshot((snapshot) => {
        if (isFirstSnapshot) {
            isFirstSnapshot = false;
            return;
        }

        let allowedList = [];

        snapshot.docs.forEach(doc => {
            let remoteData = doc.data();
            let profilePermission = remoteData["প্রোফাইল প্রদর্শনের অনুমতি"] !== false;
            let activePermission = remoteData["ছাত্রের সক্রিয়তা অনুমতি"] !== false;

            if (profilePermission && activePermission) {
                if (!remoteData.socials) remoteData.socials = {};
                if (remoteData.mobile) {
                    let rawMobile = remoteData.mobile.toString();
                    let number = rawMobile.replace(/[^\d]/g, "");
                    if (number.startsWith("0")) number = "88" + number;
                    if (rawMobile.toLowerCase().includes("wa")) remoteData.socials.wa = `https://wa.me/${number}`;
                    if (rawMobile.toLowerCase().includes("imo")) remoteData.socials.imo = `imo://chat?phone=${number}`;
                }
                allowedList.push(remoteData);
            }
        });

        window.activeStudents = allowedList;
        saveToCache(allowedList);

        if (!snapshot.metadata.fromCache) {
            const profilesContainer = document.getElementById('profilesContainer');
            profilesContainer.innerHTML = "";
            allowedList.forEach((st, i) => {
                st.originalIndex = i + 1;
                profilesContainer.innerHTML += generateProfileCardHtml(st, i + 1);
            });
        }
    }, (error) => { console.error("Realtime listener error:", error); });
}

function generateProfileCardHtml(student, index) {
    let serialNo = convertToBanglaNumber(index);
    let bloodRow = student.blood ? `<div class="info-row"><span class="info-label">রক্তের গ্রুপ</span><span class="info-data highlight-data">${student.blood}</span></div>` : '';
    let emailRow = student.socials?.email ? `<div class="info-row"><span class="info-label">ইমেইল</span><span class="info-data">${student.socials.email}</span></div>` : '';
    let studentMediaHtml = renderImageHtml(student.image, false);

    let socialBtns = [];
    socialBtns.push(createSocialButton(student.socials?.fb, 'fb', '<i class="fab fa-facebook-f"></i>', 'Facebook'));
    socialBtns.push(createSocialButton(student.socials?.yt, 'yt', '<i class="fab fa-youtube"></i>', 'YouTube'));
    socialBtns.push(createSocialButton(student.socials?.tg, 'tg', '<i class="fab fa-telegram-plane"></i>', 'Telegram'));
    socialBtns.push(createSocialButton(student.socials?.ig, 'ig', '<i class="fab fa-instagram"></i>', 'Instagram'));
    socialBtns.push(createSocialButton(student.socials?.tk, 'tk', '<i class="fab fa-tiktok"></i>', 'TikTok'));
    socialBtns.push(createSocialButton(student.socials?.wa, 'wa', '<i class="fab fa-whatsapp"></i>', 'WhatsApp'));

    if (student.socials?.email) {
        socialBtns.push(`<button class="social-btn email" onclick="handleBtnClick(this, 'mailto:${student.socials.email}')"><i class="fas fa-envelope"></i> Email</button>`);
    }
    if (isValidSocialLink(student.socials?.imo)) {
        const imoIcon = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="white"/><circle cx="50" cy="50" r="40" fill="#1286eb"/><text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-family="'Poppins',sans-serif" font-weight="800" font-size="28" fill="white">imo</text></svg>`;
        socialBtns.push(`<button class="social-btn imo" onclick="handleBtnClick(this, '${getClickableUrl(student.socials.imo)}')">${imoIcon} IMO</button>`);
    }

    const activeBtns = socialBtns.filter(btn => btn !== '');
    let socialSection = activeBtns.length > 0 ? `<div class="social-section-box"><div class="social-title">সোশ্যাল মিডিয়া সংযোগ</div><div class="social-column">${activeBtns.join('')}</div></div>` : `<div class="social-section-box"><div class="social-title">সোশ্যাল মিডিয়া সংযোগ</div><div class="no-social-text">⚠️ উক্ত ছাত্রের কোনো সোশ্যাল মিডিয়া লিংক নেই</div></div>`;

    let rawMobile = student.mobile || "";
    let cleanMobileNumber = rawMobile.replace(/[^\d]/g,"");
    let lowerMobile = rawMobile.toLowerCase();
    let inlineMobileIconsHtml = "";

    if (lowerMobile.includes("wa")) { inlineMobileIconsHtml += `<i class="fab fa-whatsapp" style="color:#25D366; font-size:18px; margin-right:5px;"></i>`; }
    if (lowerMobile.includes("imo")) { inlineMobileIconsHtml += `<svg viewBox="0 0 100 100" style="width:18px; height:18px; margin-right:5px;"><circle cx="50" cy="50" r="48" fill="white"/><circle cx="50" cy="50" r="40" fill="#1286eb"/><text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-family="'Poppins',sans-serif" font-weight="800" font-size="28" fill="white">imo</text></svg>`; }

    let inlineMobileIcons = inlineMobileIconsHtml ? `<div class="mobile-icon-wrapper">${inlineMobileIconsHtml}</div>` : `<div class="mobile-icon-wrapper"></div>`;

    return `<div class="profile-area-wrapper" id="${student.id}"><div class="profile-card"><div class="profile-top"><div class="serial-badge">ক্রমিক নং: ${serialNo}</div>${studentMediaHtml}<h2 class="profile-name">${student.name || ''}</h2><div class="profile-tag">${student.title || 'মুতাওয়াসসিতাহ'}</div></div><div class="info-container"><div class="info-row"><span class="info-label">পিতার নাম</span><span class="info-data">${student.father || ''}</span></div><div class="info-row"><span class="info-label">গ্রাম</span><span class="info-data">${student.village || ''}</span></div><div class="info-row"><span class="info-label">পোস্ট অফিস</span><span class="info-data">${student.post || ''}</span></div><div class="info-row"><span class="info-label">থানা</span><span class="info-data">${student.thana || ''}</span></div><div class="info-row"><span class="info-label">জেলা</span><span class="info-data">${student.district || ''}</span></div><div class="info-row"><span class="info-label">জিপ কোড</span><span class="info-data">${student.zip || ''}</span></div><div class="info-row"><span class="info-label">জন্ম তারিখ</span><span class="info-data">${student.dob || ''}</span></div>${bloodRow}${emailRow}<div class="info-row"><span class="info-label">মোবাইল</span><span class="info-data">${inlineMobileIcons}${cleanMobileNumber}<button class="copy-btn" onclick="copyNumber('${cleanMobileNumber}')">📋</button></span></div></div>${socialSection}</div></div>`;
}

function handleBtnClick(el, url) {
    if (url.startsWith('mailto:')) {
        window.location.href = url;
        return;
    }
    const originalContent = el.innerHTML;
    el.innerHTML = "অপেক্ষা করুন...";
    el.disabled = true;
    window.open(url, '_blank');
    setTimeout(() => {
        el.innerHTML = originalContent;
        el.disabled = false;
    }, 3000);
}

function createSocialButton(url, className, iconHtml, label) {
    if (!isValidSocialLink(url)) return '';
    let validUrl = getClickableUrl(url);
    return `<button class="social-btn ${className}" onclick="handleBtnClick(this, '${validUrl}')">${iconHtml} ${label}</button>`;
}

function renderImageHtml(imgLink, isSuggest = false) {
    let imgClass = isSuggest ? "suggest-img" : "profile-img";

    if (imgLink && imgLink.trim() !== "") {
        return `<img src="${imgLink}" class="${imgClass}" onerror="this.onerror=null; this.src='dfu.png';">`;
    } else {
        return `<img src="Delf_student.png" class="${imgClass}">`;
    }
}

function scrollToStudent(elementId){
    document.getElementById('searchInput').value = "";
    document.getElementById('suggestList').style.display = "none";
    document.getElementById('profilesContainer').style.display = "flex";
    document.getElementById('dividerText').style.display = "block";
    const element = document.getElementById(elementId);
    if(element){
        element.scrollIntoView({behavior:'smooth', block:'start'});
        element.classList.add('highlight-focus');
        setTimeout(() => element.classList.remove('highlight-focus'), 2000);
    }
}

function highlightText(text, query){
    if(!query) return text;
    const regex = new RegExp(`(${query})`, 'gi');
    return text.replace(regex, `<span class="highlight-match">$1</span>`);
}

function renderSuggestList(dataList, query, isError = false){
    const suggestContainer = document.getElementById('suggestList');
    if(isError){
        suggestContainer.style.display = "flex";
        suggestContainer.innerHTML = `<div style="text-align:center; padding:10px; color:#dc3545; font-weight:600;">❌ সার্চ অনুযায়ী কোনো ছাত্রের নাম পাওয়া যায়নি !</div>`;
        return;
    }
    if(dataList.length === 0){
        suggestContainer.style.display = "none";
        return;
    }
    suggestContainer.style.display = "flex";
    let html = '';
    dataList.forEach((student) => {
        let serialNo = convertToBanglaNumber(student.originalIndex);
        let highlightedName = highlightText(student.name, query);
        let studentMediaHtml = renderImageHtml(student.image, true);
        
        html += `<div class="suggest-item" onclick="scrollToStudent('${student.id}')">${studentMediaHtml}<div class="suggest-info"><span class="suggest-serial">ক্রমিক নং: ${serialNo}</span><span class="suggest-name">${highlightedName}</span><span class="suggest-dept">${student.title || 'মুতাওয়াসসিতাহ'}</span></div></div>`;
    });
    suggestContainer.innerHTML = html;
}

function isValidSocialLink(url){
    if(!url || typeof url !== 'string') return false;
    let trimmed = url.trim().toLowerCase();
    return !(trimmed === "" || trimmed === "#" || trimmed.includes("wrong_link"));
}

function getClickableUrl(url){
    let finalUrl = url.trim();
    if(!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://') && !finalUrl.startsWith('mailto:')){
        if(finalUrl.includes('.')) return 'https://' + finalUrl;
    }
    return finalUrl;
}

function filterProfiles(){
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const suggestContainer = document.getElementById('suggestList');
    const profilesContainer = document.getElementById('profilesContainer');
    const dividerText = document.getElementById('dividerText');

    let dataSource = window.activeStudents || [];

    if(query === ""){
        renderSuggestList([], "", false);
        profilesContainer.style.display = "flex";
        dividerText.style.display = "block";
        return;
    }

    profilesContainer.style.display = "none";
    dividerText.style.display = "none";

    const filtered = dataSource.filter(student => (student.name || "").toLowerCase().includes(query));

    if(filtered.length > 0){
        renderSuggestList(filtered, query, false);
    } else {
        renderSuggestList([], "", true);
    }
}

function convertToBanglaNumber(numberStr){
    const banglaDigits = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
    return numberStr.toString().replace(/[0-9]/g, w => banglaDigits[w]);
}

function copyNumber(text){
    if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(text).then(() => showToast());
    } else {
        let textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            showToast();
        } catch(err) { console.error(err); }
        document.body.removeChild(textArea);
    }
}

function showToast(msg){
    const toast = document.getElementById("toastMsg");
    toast.innerText = msg || "কপি হয়েছে! ✅";
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
}

window.onload = () => {
    initAndSyncModel();
};
</script>
