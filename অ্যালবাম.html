<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DARUL ULUM - Student Album Collection</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden !important;
    background: #000;
    font-family: 'Poppins', sans-serif;
    color: white;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 450px;
    max-height: 1000px;
    aspect-ratio: 720 / 1600;
    overflow: hidden;
    background: #020617;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
}

.main-scroll-wrap {
    width: 100%;
    height: 100%;
    overflow-y: scroll;
    overflow-x: hidden;
    background: linear-gradient(
        135deg,
        #020617,
        #0f172a,
        #111827,
        #1e293b
    );
    padding: 20px;
    scrollbar-width: none !important;
}

.main-scroll-wrap::-webkit-scrollbar {
    display: none !important;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding-bottom: 40px;
}


/* =========================
   BANNER
   ========================= */

.top-banner {
    position: relative;
    width: 100%;
    height: 260px;
    border-radius: 35px;
    overflow: hidden;
    margin-bottom: 22px;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.45);

    border: 1px solid rgba(255, 255, 255, 0.08);

    background: #000;

    /* কোনো ক্লিক/টাচ হবে না */
    pointer-events: none;
}

.top-banner img {
    width: 100%;
    height: 100%;

    /* banner.png পুরো ব্যানার এলাকায় সুন্দরভাবে দেখাবে */
    object-fit: cover;

    display: block;

    /* কোনো স্লাইড বা ফেড নেই */
    opacity: 1;
    filter: brightness(0.55);
}


/* Banner Overlay */

.overlay {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 20px;

    pointer-events: none;
}

.overlay h1 {
    font-size: 34px;
    font-family: 'Cinzel', serif;

    color: white;

    margin: 0 0 8px 0;

    text-shadow:
        0 5px 15px rgba(0, 0, 0, 0.6);

    letter-spacing: 2px;
}

.overlay p {
    color: #e2e8f0;

    font-size: 14px;
    line-height: 1.7;

    margin: 0;
}


/* =========================
   ALBUM TITLE
   ========================= */

.album-title {
    position: relative;

    margin-bottom: 28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.03)
        );

    border:
        1px solid rgba(255,255,255,0.08);

    border-radius: 28px;

    padding: 24px 20px;

    text-align: center;

    backdrop-filter: blur(10px);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.35);
}

.album-title h2 {
    font-size: 44px;

    color: white;

    letter-spacing: 5px;

    font-family: 'Teko', sans-serif;

    line-height: 1;

    margin: 0;
}

.album-title h3 {
    color: #cbd5e1;

    margin: 8px 0 0 0;

    font-size: 15px;

    letter-spacing: 4px;
}


/* =========================
   STUDENT LIST
   ========================= */

.student-list {
    display: flex;
    flex-direction: column;

    gap: 24px;
}


/* =========================
   STUDENT CARD
   ========================= */

.card {
    border-radius: 28px;

    overflow: hidden;

    background:
        rgba(255,255,255,0.05);

    border:
        1px solid rgba(255,255,255,0.08);

    backdrop-filter: blur(10px);

    box-shadow:
        0 12px 35px rgba(0,0,0,0.45);

    display: flex;
    flex-direction: column;
}


/* Image */

.img-container {
    width: 100%;

    padding: 15px;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        rgba(0, 0, 0, 0.2);
}

.img-container img {
    width: 100%;

    max-height: 380px;

    object-fit: contain;

    border-radius: 16px;

    display: block;
}


/* =========================
   CARD FOOTER
   ========================= */

.card-footer {
    display: flex;

    flex-direction: column;

    gap: 10px;

    padding: 14px 16px;

    background:
        rgba(15, 23, 42, 0.9);

    border-top:
        1px solid rgba(255, 255, 255, 0.08);

    align-items: center;
}

.action-buttons {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
}

.action-btn {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 5px;

    background:
        rgba(56, 189, 248, 0.15);

    border:
        1px solid rgba(56, 189, 248, 0.3);

    color: #38bdf8;

    padding: 10px 16px;

    border-radius: 12px;

    font-size: 13px;

    font-family: 'Poppins', sans-serif;

    font-weight: 600;

    cursor: default;

    text-decoration: none;

    text-align: center;

    width: 100%;
}

</style>
</head>

<body>

<div class="app-container">

    <div class="main-scroll-wrap">

        <div class="container">


            <!-- =========================
                 STATIC BANNER
                 ========================= -->

            <div class="top-banner">

                <!--
                    banner.png অবশ্যই HTML ফাইলের
                    একই ফোল্ডারে থাকতে হবে
                -->

                <img
                    src="banner.png"
                    alt="DARUL ULUM Banner"
                >

                <div class="overlay">

                    <h1>DARUL ULUM</h1>

                    <p>
                        International Islamic Madrasa
                        <br>
                        Paitka • Dhonbari • Tangail
                    </p>

                </div>

            </div>


            <!-- =========================
                 ALBUM TITLE
                 ========================= -->

            <div class="album-title">

                <h2>STUDENT</h2>

                <h3>
                    ALBUM COLLECTION
                </h3>

            </div>


            <!-- =========================
                 STUDENT LIST
                 ========================= -->

            <div
                class="student-list"
                id="studentListContainer"
            >
            </div>


        </div>

    </div>

</div>


<script type="module">

/* Firebase */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
   ========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBV1PQDsT5vRxjT_nm72uttgkZYwK0tjfE",

    authDomain:
        "abnaye-darul-uloom.firebaseapp.com",

    databaseURL:
        "https://abnaye-darul-uloom-default-rtdb.firebaseio.com",

    projectId:
        "abnaye-darul-uloom",

    storageBucket:
        "abnaye-darul-uloom.firebasestorage.app",

    messagingSenderId:
        "973857113265",

    appId:
        "1:973857113265:web:d04e29b26b442f4d0e0e90",

    measurementId:
        "G-JF6778L7TL"
};


/* Initialize Firebase */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================
   DISABLE COPY / SELECT
   ========================= */

document.addEventListener(
    'contextmenu',
    event => event.preventDefault()
);

document.addEventListener(
    'copy',
    event => event.preventDefault()
);

document.addEventListener(
    'selectstart',
    event => event.preventDefault()
);


/* =========================
   LOAD STUDENT ALBUM
   ========================= */

async function loadAlbumFromFirebase() {

    const container =
        document.getElementById(
            'studentListContainer'
        );

    try {

        const docRef =
            doc(
                db,
                "student_album",
                "sample_student"
            );

        const docSnap =
            await getDoc(docRef);


        if (docSnap.exists()) {

            const data =
                docSnap.data();

            let validImageCount = 0;


            container.innerHTML = '';


            /*
             * শুধুমাত্র img1, img2, img3...
             * এই ধরনের Firebase ফিল্ড নেওয়া হবে
             */

            const keys =
                Object.keys(data)

                .filter(
                    k => k.startsWith('img')
                )

                .sort(
                    (a, b) =>
                        parseInt(
                            a.replace('img', '')
                        )
                        -
                        parseInt(
                            b.replace('img', '')
                        )
                );


            /* প্রতিটি ছবি তৈরি */

            for (
                const fieldName of keys
            ) {

                const imgUrl =
                    data[fieldName];


                if (
                    imgUrl &&
                    typeof imgUrl === 'string' &&
                    imgUrl.trim() !== ""
                ) {

                    validImageCount++;


                    const numOnly =
                        fieldName.replace(
                            'img',
                            ''
                        );


                    const cardDiv =
                        document.createElement(
                            'div'
                        );

                    cardDiv.className =
                        'card';


                    cardDiv.innerHTML = `

                        <div class="img-container">

                            <img
                                src="${imgUrl}"
                                alt="${fieldName}"
                                loading="lazy"
                            >

                        </div>


                        <div class="card-footer">

                            <div class="action-buttons">

                                <div class="action-btn">

                                    <i class="fa-solid fa-image"></i>

                                    ছবি নং #${numOnly}

                                </div>

                            </div>

                        </div>

                    `;


                    container.appendChild(
                        cardDiv
                    );
                }
            }


            /* কোনো ছবি না থাকলে */

            if (
                validImageCount === 0
            ) {

                container.innerHTML = `

                    <p
                        style="
                            color:white;
                            text-align:center;
                            padding:20px;
                        "
                    >
                        কোনো ছবি পাওয়া যায়নি।
                    </p>

                `;
            }

        } else {

            container.innerHTML = `

                <p
                    style="
                        color:white;
                        text-align:center;
                        padding:20px;
                    "
                >
                    কোনো অ্যালবাম পাওয়া যায়নি।
                </p>

            `;
        }


    } catch (error) {

        console.error(
            "ডেটা লোড সমস্যা: ",
            error
        );


        container.innerHTML = `

            <p
                style="
                    color:#f87171;
                    text-align:center;
                    padding:20px;
                "
            >
                ডেটা লোড করতে সমস্যা হয়েছে।
            </p>

        `;
    }
}


/* =========================
   PAGE LOAD
   ========================= */

window.addEventListener(
    'DOMContentLoaded',
    loadAlbumFromFirebase
);

</script>

</body>
</html>
